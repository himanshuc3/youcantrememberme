# yaml-language-server: $schema=https://taskfile.dev/schema.json
# `task` lists everything. Python runs through uv (https://docs.astral.sh/uv/): `uv run`
# creates/updates .venv from pyproject.toml automatically, so there is nothing to activate.
# Install uv once: curl -LsSf https://astral.sh/uv/install.sh | sh

version: '3'

# Optional `.env` (copy .env.example). Real shell variables and the env set on tasks below win over it.
dotenv: ['.env']

vars:
  RUN: uv run --extra dev --extra dynamodb
  MCP_PORT: 8000
  WEB_PORT: 8080
  WORKER_MODE: baseline   # baseline = TVmaze blurbs, no AWS; llm = Claude on Bedrock (needs creds)
  DYNAMO_PORT: 8001
  DEMO_DATA: examples/demo-data
  # MCP Inspector (https://github.com/modelcontextprotocol/inspector), pinned; needs Node.
  INSPECTOR: npx -y @modelcontextprotocol/inspector@2.11.0
  MCP_URL: http://127.0.0.1:{{.MCP_PORT}}/mcp

tasks:
  default:
    desc: List available tasks
    cmds: [task --list]
    silent: true

  # ---------------------------------------------------------------- setup
  setup:
    desc: Create .venv and install dependencies (dev + dynamodb extras)
    cmds:
      - uv sync --extra dev --extra dynamodb

  # ---------------------------------------------------------------- quality
  test:
    desc: Run the automated test suite
    cmds:
      - '{{.RUN}} pytest {{.CLI_ARGS}}'

  lint:
    desc: Ruff lint + format check
    cmds:
      - '{{.RUN}} ruff check .'
      - '{{.RUN}} ruff format --check .'

  fmt:
    desc: Auto-format and fix lint issues
    cmds:
      - '{{.RUN}} ruff check --fix .'
      - '{{.RUN}} ruff format .'

  evals:
    desc: Run the spoiler-leak evals
    cmds:
      - '{{.RUN}} python -m evals.run_evals'

  check:
    desc: Everything that should pass before a commit (lint, tests, evals)
    cmds:
      - task: lint
      - task: test
      - task: evals

  # ---------------------------------------------------------------- run
  server:
    desc: Run the MCP server on :{{.MCP_PORT}} (DATA_DIR defaults to the demo data)
    env:
      DATA_DIR: '{{.DEMO_DATA}}'
      STORAGE_BACKEND: file   # offline demo data, whatever .env says
      ON_DEMAND: '0'
      PORT: '{{.MCP_PORT}}'
    cmds:
      - '{{.RUN}} python -m server.main'

  demo:
    desc: Demo only - MCP server + chat web UI (:{{.WEB_PORT}}) on the offline demo data
    env:
      STORAGE_BACKEND: file
      ON_DEMAND: '0'
    cmds:
      - '{{.RUN}} scripts/run_demo.sh'

  web:
    desc: Demo-only web chat UI (use `task inspect` for testing) (needs `task server` running)
    env:
      MCP_URL: '{{.MCP_URL}}'
    cmds:
      - '{{.RUN}} uvicorn web_demo.app:app --port {{.WEB_PORT}}'

  worker:
    desc: Process queued on-demand shows once, then exit
    cmds:
      - '{{.RUN}} python -m pipeline.worker --once'

  pipeline:
    desc: 'Build recaps from TVmaze (no AWS). Usage: task pipeline -- "Severance" "The Bear"'
    cmds:
      - '{{.RUN}} python -m pipeline.run --mode baseline {{.CLI_ARGS}}'

  pipeline:llm:
    desc: 'Build recaps with Claude on Bedrock (needs AWS creds). Usage: task pipeline:llm -- "Severance"'
    cmds:
      - '{{.RUN}} python -m pipeline.run --mode llm {{.CLI_ARGS}}'

  # ---------------------------------------------------------------- inspect
  inspect:
    desc: MCP Inspector web UI, preconnected to the local server (needs Node; `task server` running)
    cmds:
      - >-
        {{.INSPECTOR}} --web --transport http --server-url {{.MCP_URL}}

  inspect:list:
    desc: List the server's tools via the Inspector CLI (no browser)
    cmds:
      - >-
        {{.INSPECTOR}} --cli --transport http --server-url {{.MCP_URL}}
        --method tools/list

  inspect:call:
    desc: 'Call one tool. Usage: task inspect:call -- find_show query="The Lighthouse Keepers"'
    env:
      INSPECTOR: '{{.INSPECTOR}}'
      MCP_URL: '{{.MCP_URL}}'
    cmds:
      - scripts/mcp_call.sh {{.CLI_ARGS}}

  inspect:smoke:
    desc: Scripted walkthrough of every tool on the demo data (needs `task server` running)
    env:
      INSPECTOR: '{{.INSPECTOR}}'
      MCP_URL: '{{.MCP_URL}}'
    cmds:
      - scripts/mcp_call.sh find_show query="The Lighthouse Keepers"
      - scripts/mcp_call.sh catch_me_up show="The Lighthouse Keepers" season=1 episode=3
      - scripts/mcp_call.sh get_previously_on show="The Lighthouse Keepers" season=1 episode=3
      - scripts/mcp_call.sh get_recap show="The Lighthouse Keepers" to_season=1 to_episode=3

  mcp:list:
    desc: List tools with plain curl (no Node needed)
    cmds:
      - >-
        curl -s -H 'Content-Type: application/json'
        -H 'Accept: application/json, text/event-stream'
        {{.MCP_URL}}
        -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'

  # ---------------------------------------------------------------- infra
  db:up:
    desc: Start DynamoDB Local in Docker (:{{.DYNAMO_PORT}}), create tables, seed demo data
    cmds:
      - '{{.RUN}} scripts/dynamo_local.sh'

  db:down:
    desc: Stop DynamoDB Local (keeps data)
    cmds: [docker compose down]

  db:reset:
    desc: Stop DynamoDB Local and delete its data volume
    prompt: This deletes the local DynamoDB data. Continue?
    cmds: [docker compose down -v]

  db:show:
    desc: 'Look inside local DynamoDB. Usage: task db:show | task db:show -- shows | task db:show -- shows 526'
    env:
      STORAGE_BACKEND: dynamodb
      DYNAMODB_ENDPOINT_URL: http://localhost:{{.DYNAMO_PORT}}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    cmds:
      - '{{.RUN}} python scripts/db_show.py {{.CLI_ARGS}}'

  server:dynamo:
    desc: MCP server on DynamoDB Local with on-demand fetching on (run `task db:up` first)
    vars:
      SERVER_CMD: '{{.SERVER_CMD | default "python -m server.main"}}'
    env:
      STORAGE_BACKEND: dynamodb
      DYNAMODB_ENDPOINT_URL: http://localhost:{{.DYNAMO_PORT}}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      ON_DEMAND: '1'
      PORT: '{{.MCP_PORT}}'
      DATA_DIR: data   # only the pipeline's download/LLM caches live here with DynamoDB
    cmds:
      - '{{.RUN}} {{.SERVER_CMD}}'

  worker:dynamo:
    desc: Worker that fills DynamoDB Local for queued shows; polls forever (WORKER_MODE=baseline|llm)
    vars:
      WORKER_CMD: '{{.WORKER_CMD | default (printf "python -m pipeline.worker --mode %s --poll 2" .WORKER_MODE)}}'
    env:
      STORAGE_BACKEND: dynamodb
      DYNAMODB_ENDPOINT_URL: http://localhost:{{.DYNAMO_PORT}}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      DATA_DIR: data
    cmds:
      - '{{.RUN}} {{.WORKER_CMD}}'

  # ---------------------------------------------------------------- dev (everything at once)
  dev:
    desc: DynamoDB Local + MCP server + worker + Inspector, server/worker restart on code changes
    cmds:
      - task: db:up
      - task: dev:services

  dev:services:
    internal: true
    deps: [dev:server, dev:worker, dev:inspector]

  dev:server:
    internal: true
    cmds:
      - task: server:dynamo
        vars: {SERVER_CMD: 'watchfiles "python -m server.main" server common'}

  dev:worker:
    internal: true
    cmds:
      - task: worker:dynamo
        vars:
          WORKER_CMD: 'watchfiles "python -m pipeline.worker --mode {{.WORKER_MODE}} --poll 2" pipeline common'

  dev:inspector:
    internal: true
    cmds:
      - sleep 3   # let the server bind first
      - task: inspect

  # ---------------------------------------------------------------- expose
  tunnel:
    desc: 'Public HTTPS URL for Alexa+ (needs cloudflared). Then: ALLOWED_HOSTS=<host> task server'
    cmds:
      - cloudflared tunnel --url http://127.0.0.1:{{.MCP_PORT}}
