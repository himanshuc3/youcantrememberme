[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youcantrememberme"
version = "0.1.0"
description = "Spoiler-safe TV catch-up recaps as an Alexa+ MCP add-on"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",       # 2.x: FastMCP was renamed MCPServer
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.optional-dependencies]
# offline digest generation (provider still to be decided: Claude API or Bedrock)
pipeline = ["anthropic>=0.40"]
# AWS Lambda entry point (server/handler.py)
aws = ["mangum>=0.17"]
# fallback demo client
web = ["fastapi>=0.110", "uvicorn>=0.30"]
# icon generation for addon-package/
assets = ["pillow>=10"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["common*", "pipeline*", "server*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
