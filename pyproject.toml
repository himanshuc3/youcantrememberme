[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "youcantrememberme"
version = "0.1.0"
description = "Spoiler-safe TV catch-up recaps as an Alexa+ MCP add-on"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",       # 2.x: FastMCP was renamed MCPServer
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.optional-dependencies]
# offline digest generation: Claude on Amazon Bedrock (AnthropicBedrockMantle client)
pipeline = ["anthropic[bedrock]>=1.13"]
# AWS Lambda entry point (server/handler.py)
aws = ["mangum>=0.17"]
# fallback demo client
web = ["fastapi>=0.110", "uvicorn>=0.30"]
# icon generation for addon-package/
assets = ["pillow>=10"]
# storage backend (STORAGE_BACKEND=dynamodb: DynamoDB Local in dev, AWS in production; see common/backend.py)
dynamodb = ["boto3>=1.34"]
# everything the test suite needs: `pip install -e ".[dev]"` is enough
dev = [
    "pytest>=8", "ruff>=0.5", "fastapi>=0.110", "uvicorn>=0.30",
    "moto[dynamodb]>=5", "boto3>=1.34",  # in-memory DynamoDB for tests
    "watchfiles>=0.21",  # auto-restart server/worker in `task dev`
]

[tool.setuptools.packages.find]
include = ["common*", "pipeline*", "server*", "evals*", "web_demo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# so bare `pytest` (not just `python -m pytest`) can import the repo's packages
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
